name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format kontrolü
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit/integration testleri
        run: pnpm test

      - name: Prisma şema doğrulama (yer tutucu URL, bağlantı açılmaz)
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: pnpm db:validate

      - name: Build
        run: pnpm build
